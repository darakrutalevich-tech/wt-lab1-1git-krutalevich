<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое любимое лето</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            color: #333;
        }

        h1.page-title {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #4a4a4a;
        }

        .line {
            width: 60px;
            height: 3px;
            background: #ff9a9e;
            border-radius: 2px;
        }

        /* Карточка */
        .card-media {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #000;
            cursor: pointer;
            height: 350px;
        }

        .card-media:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .card-media img,
        .card-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .card-media:hover img,
        .card-media:hover video {
            transform: scale(1.05);
        }

        .video-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            z-index: 3;
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            color: #fff;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 3;
        }

        .card-media:hover .caption {
            opacity: 1;
            transform: translateY(0);
        }

        .caption h2 {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .caption p {
            font-size: 0.9rem;
            opacity: 0.85;
            margin: 0;
        }

        @media (max-width: 600px) {
            h1.page-title {
                font-size: 1.8rem;
            }

            .card-media {
                height: 300px;
            }

            .caption {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container py-5">

        <header class="text-center mb-4">
            <h1 class="page-title">Моё лето</h1>
            <div class="line mx-auto mt-2"></div>
        </header>

        <div class="row g-4 justify-content-center">

            <div class="col-12 col-sm-6 col-lg-4 d-flex justify-content-center">
                <div class="card-media w-100">
                    <img src="video&photo/city.jpg" alt="МоскваСити" class="img-fluid">
                    <div class="caption">
                        <h2>Москва Сити</h2>
                        <p>Солнце, Дори и небоскреб</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4 d-flex justify-content-center">
                <div class="card-media w-100">
                    <img src="video&photo/gp.jpg" alt="Гендерпати" class="img-fluid">
                    <div class="caption">
                        <h2>Гендер Пати</h2>
                        <p>Мальчик и я угадала</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4 d-flex justify-content-center">
                <div class="card-media w-100">
                    <img src="video&photo/spiderman.jpg" alt="Чикпук" class="img-fluid">
                    <div class="caption">
                        <h2>Удача в автомате</h2>
                        <p>Выиграли человека паука</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4 d-flex justify-content-center">
                <div class="card-media w-100">
                    <span class="badge bg-dark bg-opacity-75 video-badge">▶ ВИДЕО</span>
                    <video src="video&photo/amuspark.MOV" muted loop playsinline onmouseover="this.play()"
                        onmouseout="this.pause(); this.currentTime = 0;">
                    </video>
                    <div class="caption">
                        <h2>Парк аттракционов</h2>
                        <p>Поездка в Гомель</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4 d-flex justify-content-center">
                <div class="card-media w-100">
                    <span class="badge bg-dark bg-opacity-75 video-badge">▶ ВИДЕО</span>
                    <video src="video&photo/dance.MP4" muted loop playsinline onmouseover="this.play()"
                        onmouseout="this.pause(); this.currentTime = 0;">
                    </video>
                    <div class="caption">
                        <h2>Танцы</h2>
                        <p>Тик ток тренды</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-4 d-flex justify-content-center">
                <div class="card-media w-100">
                    <span class="badge bg-dark bg-opacity-75 video-badge">▶ ВИДЕО</span>
                    <video src="video&photo/Mog.MOV" muted loop playsinline onmouseover="this.play()"
                        onmouseout="this.pause(); this.currentTime = 0;">
                    </video>
                    <div class="caption">
                        <h2>Fever</h2>
                        <p>Встреча с друзьями</p>
                    </div>
                </div>
            </div>

        </div>

        <footer class="text-center mt-5 text-muted small">
            Лето 2026
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
